spring.application.name=notificaciones
server.port=8089
spring.datasource.url=jdbc:h2:mem:notificaciones
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jmx.enabled=false
spring.application.admin.enabled=false
logging.level.org.hibernate.SQL=DEBUG
spring.jackson.default-property-inclusion=non_null
spring.web.error.include-message=always
notificaciones.max-intentos=3
notificaciones.emisor.tasa-fallo=0.3
# INT-01: modo=simulado por defecto o http para llamar al módulo Usuarios real
notificaciones.usuarios.modo=${NOTIFICACIONES_USUARIOS_MODO:simulado}
notificaciones.usuarios.base-url=${USUARIOS_BASE_URL:http://localhost:8080}
# La API key se obtiene del entorno; no guardar la clave real en este archivo
notificaciones.usuarios.api-key=${USUARIOS_API_KEY}
notificaciones.usuarios.timeout-ms=2000
# Seguridad: clave con la que el módulo Usuarios firma los JWT (HS256, mínimo 32 caracteres).
# El valor por defecto es SOLO para desarrollo; en un entorno real se define con la variable JWT_SECRET
notificaciones.jwt.secret=${JWT_SECRET:deliverygo-clave-de-desarrollo-cambiar-en-produccion}
# CORS: orígenes (separados por coma) desde los que el Portal Web puede llamar a esta API
notificaciones.cors.origenes-permitidos=http://localhost:5173
springdoc.swagger-ui.path=/swagger-ui.html

logging.pattern.level=%5p [%X{correlationId:-}]
