spring.application.name=notificaciones
server.port=8089
spring.datasource.url=jdbc:h2:mem:notificaciones
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jmx.enabled=false
spring.application.admin.enabled=false
logging.level.org.hibernate.SQL=DEBUG
spring.jackson.default-property-inclusion=non_null
spring.web.error.include-message=always
notificaciones.max-intentos=3
notificaciones.emisor.tasa-fallo=0.3
# INT-01: modo=simulado (usuarios fijos en memoria) o http (llama al módulo Usuarios real)
notificaciones.usuarios.modo=simulado
notificaciones.usuarios.base-url=http://localhost:8080
notificaciones.usuarios.timeout-ms=2000
springdoc.swagger-ui.path=/swagger-ui.html

logging.pattern.level=%5p [%X{correlationId:-}]
